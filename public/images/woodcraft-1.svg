<svg width="300" height="300" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <defs>
    <linearGradient id="wood1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a89070;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7a6550;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="300" height="300" fill="#faf8f3"/>
  <ellipse cx="150" cy="245" rx="85" ry="15" fill="#000" opacity="0.08"/>
  <!-- Wood tray (soban) -->
  <rect x="70" y="95" width="160" height="110" fill="url(#wood1)" stroke="#5a4a35" stroke-width="1.5" rx="8"/>
  <!-- Wood grain texture -->
  <line x1="80" y1="105" x2="220" y2="105" stroke="#8a7a65" stroke-width="0.5" opacity="0.4"/>
  <line x1="75" y1="125" x2="225" y2="125" stroke="#8a7a65" stroke-width="0.5" opacity="0.3"/>
  <line x1="80" y1="145" x2="220" y2="145" stroke="#8a7a65" stroke-width="0.5" opacity="0.3"/>
  <line x1="75" y1="165" x2="225" y2="165" stroke="#8a7a65" stroke-width="0.5" opacity="0.4"/>
  <line x1="80" y1="190" x2="220" y2="190" stroke="#8a7a65" stroke-width="0.5" opacity="0.3"/>
  <!-- Wood knots -->
  <ellipse cx="100" cy="130" rx="3" ry="2" fill="#5a4a35" opacity="0.6"/>
  <ellipse cx="200" cy="160" rx="3" ry="2" fill="#5a4a35" opacity="0.6"/>
  <!-- Natural highlight -->
  <ellipse cx="110" cy="110" rx="30" ry="40" fill="#fff" opacity="0.1"/>
</svg>