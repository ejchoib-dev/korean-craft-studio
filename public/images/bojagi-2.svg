<svg width="300" height="300" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <rect width="300" height="300" fill="#faf8f3"/>
  <!-- Embroidered bojagi - rotated diamond -->
  <polygon points="150,60 230,150 150,240 70,150" fill="#d4a0b5" opacity="0.88" stroke="#c4879f" stroke-width="1"/>
  <!-- Embroidered flower pattern -->
  <circle cx="120" cy="120" r="8" fill="#b58ba8" opacity="0.5"/>
  <circle cx="180" cy="120" r="8" fill="#b58ba8" opacity="0.5"/>
  <circle cx="150" cy="85" r="8" fill="#b58ba8" opacity="0.5"/>
  <circle cx="150" cy="155" r="8" fill="#b58ba8" opacity="0.5"/>
  <circle cx="120" cy="180" r="8" fill="#b58ba8" opacity="0.5"/>
  <circle cx="180" cy="180" r="8" fill="#b58ba8" opacity="0.5"/>
  <!-- Flower details (embroidery marks) -->
  <circle cx="120" cy="120" r="3" fill="#a57393" opacity="0.7"/>
  <circle cx="180" cy="120" r="3" fill="#a57393" opacity="0.7"/>
  <circle cx="150" cy="85" r="3" fill="#a57393" opacity="0.7"/>
  <circle cx="150" cy="155" r="3" fill="#a57393" opacity="0.7"/>
  <circle cx="120" cy="180" r="3" fill="#a57393" opacity="0.7"/>
  <circle cx="180" cy="180" r="3" fill="#a57393" opacity="0.7"/>
  <!-- Silk sheen -->
  <ellipse cx="130" cy="110" rx="40" ry="35" fill="#fff" opacity="0.08"/>
</svg>