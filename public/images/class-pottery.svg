<svg width="300" height="300" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <defs>
    <radialGradient id="classPot" cx="35%" cy="35%">
      <stop offset="0%" style="stop-color:#f5ede3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4bfaa;stop-opacity:1" />
    </radialGradient>
  </defs>
  <rect width="300" height="300" fill="#faf8f3"/>
  <!-- Hands shaping pottery -->
  <ellipse cx="130" cy="180" rx="12" ry="20" fill="#d4a894" opacity="0.7" transform="rotate(-25 130 180)"/>
  <ellipse cx="170" cy="180" rx="12" ry="20" fill="#d4a894" opacity="0.7" transform="rotate(25 170 180)"/>
  <!-- Potter's wheel clay -->
  <circle cx="150" cy="130" r="60" fill="url(#classPot)" stroke="#c4a892" stroke-width="1"/>
  <circle cx="150" cy="130" r="55" fill="none" stroke="#d4c4b0" stroke-width="0.5" opacity="0.5"/>
  <!-- Wheel center -->
  <circle cx="150" cy="130" r="8" fill="#c4a892" opacity="0.5"/>
  <!-- Workshop scene indicator -->
  <ellipse cx="150" cy="240" rx="60" ry="8" fill="#000" opacity="0.06"/>
</svg>