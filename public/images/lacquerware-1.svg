<svg width="300" height="300" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <rect width="300" height="300" fill="#faf8f3"/>
  <ellipse cx="150" cy="245" rx="80" ry="14" fill="#000" opacity="0.1"/>
  <!-- Lacquerware box -->
  <rect x="75" y="80" width="150" height="130" fill="#1a0f08" stroke="#3d2817" stroke-width="1" rx="3"/>
  <!-- Lid with mother-of-pearl pattern -->
  <rect x="80" y="85" width="140" height="50" fill="#2a1810" stroke="#4a3520" stroke-width="0.5" rx="2"/>
  <!-- Shell inlay (abalone pattern) -->
  <ellipse cx="115" cy="110" rx="12" ry="8" fill="#8faea8" opacity="0.7"/>
  <ellipse cx="150" cy="108" rx="10" ry="7" fill="#9db8b3" opacity="0.65"/>
  <ellipse cx="185" cy="110" rx="11" ry="8" fill="#8faea8" opacity="0.72"/>
  <!-- Decorative line -->
  <line x1="85" y1="75" x2="215" y2="75" stroke="#4a3520" stroke-width="1"/>
  <!-- Gold/brass accent -->
  <circle cx="95" cy="130" r="4" fill="#d4a555" opacity="0.6"/>
  <circle cx="205" cy="130" r="4" fill="#d4a555" opacity="0.6"/>
  <!-- Gloss effect -->
  <ellipse cx="130" cy="95" rx="25" ry="15" fill="#fff" opacity="0.08"/>
</svg>