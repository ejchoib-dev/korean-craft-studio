<svg width="300" height="300" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <rect width="300" height="300" fill="#faf8f3"/>
  <!-- Work surface for inlay -->
  <rect x="75" y="75" width="150" height="125" fill="#1a0f08" stroke="#3d2817" stroke-width="1.2" rx="3"/>
  <!-- Abalone shell pieces -->
  <ellipse cx="110" cy="110" rx="15" ry="10" fill="#8faea8" opacity="0.65" stroke="#7a9599" stroke-width="0.5"/>
  <ellipse cx="150" cy="105" rx="12" ry="8" fill="#9db8b3" opacity="0.6" stroke="#8aa9a4" stroke-width="0.5"/>
  <ellipse cx="190" cy="115" rx="14" ry="9" fill="#8faea8" opacity="0.68" stroke="#7a9599" stroke-width="0.5"/>
  <!-- Tool (crafting implement) -->
  <line x1="95" y1="170" x2="205" y2="170" stroke="#4a3520" stroke-width="1"/>
  <circle cx="95" cy="170" r="4" fill="#6a5540" opacity="0.7"/>
  <!-- Inlay pattern lines -->
  <path d="M 120 130 L 180 130" stroke="#7a9599" stroke-width="0.8" opacity="0.4"/>
  <path d="M 115 150 L 185 150" stroke="#7a9599" stroke-width="0.8" opacity="0.4"/>
  <!-- Lacquer shine effect -->
  <ellipse cx="130" cy="100" rx="35" ry="30" fill="#fff" opacity="0.1"/>
  <!-- Shadow -->
  <ellipse cx="150" cy="200" rx="65" ry="10" fill="#000" opacity="0.05"/>
</svg>