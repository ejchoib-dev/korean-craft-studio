<svg width="300" height="300" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <defs>
    <linearGradient id="wood2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#b8956a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8a7260;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="300" height="300" fill="#faf8f3"/>
  <ellipse cx="150" cy="250" rx="85" ry="13" fill="#000" opacity="0.09"/>
  <!-- Cutting board (doma) -->
  <rect x="65" y="70" width="170" height="140" fill="url(#wood2)" stroke="#6a5a4a" stroke-width="1.5" rx="10"/>
  <!-- Wood grain pattern -->
  <line x1="75" y1="85" x2="225" y2="85" stroke="#9a8270" stroke-width="0.8" opacity="0.35"/>
  <line x1="70" y1="110" x2="230" y2="110" stroke="#9a8270" stroke-width="0.6" opacity="0.28"/>
  <line x1="75" y1="135" x2="225" y2="135" stroke="#9a8270" stroke-width="0.7" opacity="0.3"/>
  <line x1="70" y1="160" x2="230" y2="160" stroke="#9a8270" stroke-width="0.6" opacity="0.28"/>
  <line x1="75" y1="185" x2="225" y2="185" stroke="#9a8270" stroke-width="0.5" opacity="0.25"/>
  <!-- Wood knots and marks -->
  <ellipse cx="95" cy="125" rx="2.5" ry="2" fill="#6a5a4a" opacity="0.5"/>
  <ellipse cx="205" cy="155" rx="2.5" ry="2" fill="#6a5a4a" opacity="0.5"/>
  <ellipse cx="140" cy="100" rx="2" ry="1.5" fill="#6a5a4a" opacity="0.4"/>
  <!-- Edge highlight -->
  <ellipse cx="100" cy="100" rx="35" ry="45" fill="#fff" opacity="0.12"/>
</svg>